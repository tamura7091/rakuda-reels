# The daily Rakuda reel: Claude Code (on Naoki's Claude plan, CLAUDE_CODE_OAUTH_TOKEN) picks a topic, checks the facts,
# writes the script, has ElevenLabs read it, draws the visuals, checks the stills and renders the mp4 (PROMPT.md); then
# tools/post.mjs publishes it to @rakuda.studio. Runs at 19:30 JST so the reel is up around 20:00.
# Run by hand (Actions → Daily reel → Run workflow) to make one without posting, or tick "publish".
name: Daily reel
on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Post it to Instagram
        type: boolean
        default: false
permissions:
  contents: write
concurrency: reel
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg, Japanese fonts, Claude Code
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk > /dev/null
          npm ci
          npm install -g @anthropic-ai/claude-code
      - name: Make the reel (Claude Code)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          echo "Today is $(TZ=Asia/Tokyo date +%F) (JST)." | cat - PROMPT.md > /tmp/prompt.md
          claude -p "$(cat /tmp/prompt.md)" --model opus --dangerously-skip-permissions --output-format stream-json --verbose > claude.log || true
          tail -n 1 claude.log | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).result)}catch{console.log(s)}})'
      - name: Find the finished reel
        id: reel
        run: |
          dir=$(ls -d reels/$(TZ=Asia/Tokyo date +%F)-*/ 2>/dev/null | while read d; do [ -f "$d/READY" ] && [ -f "$d/reel.mp4" ] && echo "${d%/}"; done | tail -n 1)
          if [ -z "$dir" ]; then echo "No finished reel today (no READY + reel.mp4). See the log above."; exit 1; fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel
          path: |
            reels/*/reel.mp4
            reels/*/preview.jpg
            claude.log
          if-no-files-found: ignore
      - name: Post to Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: node tools/post.mjs ${{ steps.reel.outputs.dir }} ${{ (github.event_name == 'schedule' || inputs.publish) && '--publish' || '' }}
      - name: Keep the script, visuals and token state
        if: always()
        run: |
          git config user.name "rakuda-reels"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reels history.json state 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "reel: ${{ steps.reel.outputs.dir || 'unfinished run' }}"
          git pull --rebase -q && git push -q
