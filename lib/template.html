<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- One 1080x1920 frame of a reel. tools/render.mjs loads it, calls setup(timeline) once, then render(t) per frame.
     Layout (same as the Rakuda reels):
       title pill   y 90-170
       stage        y 230-1230  (the reel's own visual.js draws here, 1080x1000)
       caption      y 1270-1470 (white box, lights up character by character as the voice says it)
       credit       y 1500
     Instagram covers the bottom ~380px and the right ~140px with its own buttons: nothing important goes there. -->
<style>
:root{--bg:linear-gradient(180deg,#0B2545 0%,#10263D 55%,#0E2236 100%);--ink:#EAF2FA;--dim:#4A6A8A;--accent:#34D399;--warn:#F87171}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-synthesis:none}
#title{position:absolute;top:96px;left:50%;transform:translateX(-50%);padding:14px 40px;border-radius:22px;white-space:nowrap;
  background:rgba(234,242,250,.10);border:2px solid rgba(234,242,250,.22);font-size:50px;font-weight:800;letter-spacing:.01em}
#stage{position:absolute;left:0;top:230px;width:1080px;height:1000px;overflow:hidden}
#cap{position:absolute;left:90px;right:90px;top:1270px;height:200px;display:flex;align-items:flex-start;justify-content:center}
#capt{background:#F4F7FA;color:#0E2236;border-radius:22px;padding:18px 34px;font-size:54px;font-weight:800;line-height:1.38;
  text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:900px;word-break:auto-phrase;text-wrap:balance}
#capt:empty{display:none}
#capt span{color:#9AA8B6}
#capt span.on{color:#0E2236}
#end{position:absolute;left:0;top:230px;width:1080px;height:1000px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;opacity:0}
#end img{width:240px;height:240px}
#end .name{font-size:96px;font-weight:800;letter-spacing:.02em}
#end .what{font-size:44px;font-weight:700;color:rgba(234,242,250,.8)}
#end .url{font-size:40px;font-weight:700;color:var(--accent);margin-top:6px}
#credit{position:absolute;top:1490px;left:0;right:0;text-align:center;font-size:24px;font-weight:600;color:rgba(234,242,250,.55);letter-spacing:.04em}
</style>
</head>
<body>
<div id="title"></div>
<div id="stage"></div>
<div id="end"><img src="logo.png" alt=""><div class="name">Rakuda</div><div class="what">AI動画編集ツール</div><div class="url">www.rakuda.studio</div></div>
<div id="cap"><div id="capt"></div></div>
<div id="credit">編集ソフト | www.rakuda.studio</div>
<script src="../node_modules/d3/dist/d3.min.js"></script>
<script src="kit.js"></script>
<script>
window.REEL = {};
let TL = null, drawVisual = null, shownLine = -1, endAt = Infinity;
const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3));

// timeline: {title, duration, lines:[{text, start, end, chars:[{c, start, end}]}]} in seconds on the video's clock
window.setup = async (tl, visualSrc) => {
  TL = tl;
  document.getElementById('title').textContent = tl.title;
  if (tl.theme) for (const [k, v] of Object.entries(tl.theme)) document.documentElement.style.setProperty('--' + k, v);
  // the end card: from the first line of the closing CTA (「この動画は、…」) the stage hands over to the Rakuda card
  const cta = tl.lines.findIndex((l) => l.text.startsWith('この動画は'));
  if (cta >= 0) endAt = tl.lines[cta].start - 0.25;
  await document.querySelector('#end img').decode();
  const s = document.createElement('script');
  s.src = visualSrc;
  await new Promise((ok, fail) => { s.onload = ok; s.onerror = () => fail(new Error('visual.js failed to load')); document.body.appendChild(s); });
  if (typeof REEL.visual !== 'function') throw new Error('visual.js must set REEL.visual = (stage, tl) => render(t)');
  drawVisual = await REEL.visual(document.getElementById('stage'), tl);
  if (typeof drawVisual !== 'function') throw new Error('REEL.visual must return a render(t) function');
};

function lineAt(t) {
  const L = TL.lines;
  for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start - 0.05) return t < L[i].end + 0.6 || i === L.length - 1 ? i : -1;
  return -1;
}

window.render = async (t) => {
  const i = lineAt(t), capt = document.getElementById('capt');
  if (i !== shownLine) {
    shownLine = i;
    capt.innerHTML = '';
    if (i >= 0) for (const ch of TL.lines[i].chars) { const s = document.createElement('span'); s.textContent = ch.c; capt.appendChild(s); }
  }
  if (i >= 0) TL.lines[i].chars.forEach((ch, k) => capt.children[k].classList.toggle('on', t >= ch.start));
  const e = ease((t - endAt) / 0.5);
  document.getElementById('stage').style.opacity = String(1 - e);
  const end = document.getElementById('end');
  end.style.opacity = String(e);
  end.style.transform = `scale(${0.94 + 0.06 * e})`;
  if (e < 1) await drawVisual(Math.min(t, endAt));
};
</script>
</body>
</html>
